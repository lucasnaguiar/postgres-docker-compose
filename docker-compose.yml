services:
  postgres:
    restart: always
    image: postgres:18
    container_name: postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./docker-persist/db/pgsql:/var/lib/postgresql 
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true
